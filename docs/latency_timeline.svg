<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where the 13 cycles go: wire to best bid/offer</title>
  <!-- Explicit background so the image reads the same in light and dark themes. -->
  <rect width="960" height="400" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="600" fill="#1f2328">Where the 13 cycles go — last byte of a message in, its best bid/offer out</text>
  <text x="24" y="56" font-size="13" fill="#57606a">one column = one 6.4 ns clock at 156.25 MHz · every message takes exactly this path, whatever its data</text>

  <!-- cycle grid: x = 170 + 50*c -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="170" y1="76" x2="170" y2="334"/><line x1="220" y1="76" x2="220" y2="334"/>
    <line x1="270" y1="76" x2="270" y2="334"/><line x1="320" y1="76" x2="320" y2="334"/>
    <line x1="370" y1="76" x2="370" y2="334"/><line x1="420" y1="76" x2="420" y2="334"/>
    <line x1="470" y1="76" x2="470" y2="334"/><line x1="520" y1="76" x2="520" y2="334"/>
    <line x1="570" y1="76" x2="570" y2="334"/><line x1="620" y1="76" x2="620" y2="334"/>
    <line x1="670" y1="76" x2="670" y2="334"/><line x1="720" y1="76" x2="720" y2="334"/>
    <line x1="770" y1="76" x2="770" y2="334"/><line x1="820" y1="76" x2="820" y2="334"/>
    <line x1="870" y1="76" x2="870" y2="334"/>
  </g>
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="195" y="72">1</text><text x="245" y="72">2</text><text x="295" y="72">3</text>
    <text x="345" y="72">4</text><text x="395" y="72">5</text><text x="445" y="72">6</text>
    <text x="495" y="72">7</text><text x="545" y="72">8</text><text x="595" y="72">9</text>
    <text x="645" y="72">10</text><text x="695" y="72">11</text><text x="745" y="72">12</text>
    <text x="795" y="72">13</text><text x="845" y="72">14</text>
  </g>

  <!-- stage labels -->
  <g font-size="14" fill="#1f2328" font-weight="600">
    <text x="24" y="104">hdr_parse</text>
    <text x="24" y="144">msg_frame</text>
    <text x="24" y="184">decode</text>
    <text x="24" y="224">order_table</text>
    <text x="24" y="264">price_levels</text>
    <text x="24" y="304">output regs</text>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="24" y="118">headers off, realign</text>
    <text x="24" y="158">cut whole messages</text>
    <text x="24" y="198">fields → book op</text>
    <text x="24" y="238">ref → side, price, size</text>
    <text x="24" y="278">ladder + encoders</text>
    <text x="24" y="318">tick → price</text>
  </g>

  <!-- bars: hdr_parse c1, msg_frame c2, decode c3-5, order_table c6-7, price_levels c8-12, out c13 -->
  <g font-size="10.5" fill="#ffffff" text-anchor="middle">
    <rect x="172" y="88" width="46" height="30" rx="4" fill="#0969da"/>
    <text x="195" y="107">realign</text>
    <!-- the optional second hdr_parse cycle -->
    <rect x="222" y="88" width="46" height="30" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="245" y="107" fill="#0969da">+1?</text>

    <rect x="222" y="128" width="46" height="30" rx="4" fill="#1a7f37"/>
    <text x="245" y="147">frame</text>

    <rect x="272" y="168" width="46" height="30" rx="4" fill="#8250df"/>
    <text x="295" y="187">extract</text>
    <rect x="322" y="168" width="46" height="30" rx="4" fill="#8250df"/>
    <text x="345" y="187">×⅟₂₅ DSP</text>
    <rect x="372" y="168" width="46" height="30" rx="4" fill="#8250df"/>
    <text x="395" y="187">tick ok?</text>

    <rect x="422" y="208" width="46" height="30" rx="4" fill="#bf3989"/>
    <text x="445" y="227">read set</text>
    <rect x="472" y="208" width="46" height="30" rx="4" fill="#bf3989"/>
    <text x="495" y="221">8-way</text>
    <text x="495" y="233">match</text>

    <rect x="522" y="248" width="46" height="30" rx="4" fill="#bc4c00"/>
    <text x="545" y="267">read lvl</text>
    <rect x="572" y="248" width="46" height="30" rx="4" fill="#bc4c00"/>
    <text x="595" y="261">modify</text>
    <text x="595" y="273">write</text>
    <rect x="622" y="248" width="46" height="30" rx="4" fill="#bc4c00"/>
    <text x="645" y="261">encode</text>
    <text x="645" y="273">64 grps</text>
    <rect x="672" y="248" width="46" height="30" rx="4" fill="#bc4c00"/>
    <text x="695" y="261">encode</text>
    <text x="695" y="273">winner</text>
    <rect x="722" y="248" width="46" height="30" rx="4" fill="#bc4c00"/>
    <text x="745" y="261">BBO</text>
    <text x="745" y="273">size</text>

    <rect x="772" y="288" width="46" height="30" rx="4" fill="#57606a"/>
    <text x="795" y="307">+ base</text>
  </g>

  <!-- totals -->
  <line x1="170" y1="346" x2="820" y2="346" stroke="#1f2328" stroke-width="1.5"/>
  <line x1="170" y1="340" x2="170" y2="352" stroke="#1f2328" stroke-width="1.5"/>
  <line x1="820" y1="340" x2="820" y2="352" stroke="#1f2328" stroke-width="1.5"/>
  <text x="495" y="368" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">13 cycles = 83 ns  (14 = 90 ns when the last byte needs the next beat to realign)</text>
  <text x="495" y="388" font-size="12" fill="#57606a" text-anchor="middle">A Replace adds one cycle in order_table for its second ladder update. Measured and asserted constant by tb/test_feed_handler_top.py.</text>
</svg>
